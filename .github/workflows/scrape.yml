name: Scrape Tournaments Daily

on:
  push:
    branches:
      - main
    paths:
      - 'scraper/**'
      - '.github/workflows/scrape.yml'
  schedule:
    # Run every 4 hours (transze: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  # Also allow manual trigger from GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install scraper dependencies
        run: |
          npm install
          npx puppeteer browsers install chrome
        working-directory: scraper

      - name: Run scraper
        run: node scraper.js
        working-directory: scraper

      - name: Commit and push updated data
        run: |
          git config user.name "chess-tour-bot"
          git config user.email "bot@chess-tour.app"
          git pull --rebase origin main
          git add data/tournaments.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update tournaments $(date -u +%Y-%m-%d)"
          git push origin main

